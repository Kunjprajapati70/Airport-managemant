services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  - type: web
    name: aeromanage-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false          # set manually in Render dashboard
      - key: JWT_SECRET
        sync: false          # set manually in Render dashboard
      - key: JWT_EXPIRE
        value: 7d
      - key: CLIENT_URL
        sync: false          # set to your frontend Render URL
      - key: FROM_EMAIL
        value: noreply@aeromanage.com
      - key: FROM_NAME
        value: AeroManage
      # Optional — leave blank to skip emails
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
    healthCheckPath: /api/health

  # ── Frontend (Static Site) ───────────────────────────────────────────────────
  - type: web
    name: aeromanage-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html    # SPA fallback — all routes → index.html
    envVars:
      - key: VITE_API_URL
        sync: false                 # set to your backend Render URL
